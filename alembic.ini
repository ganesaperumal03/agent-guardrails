# Alembic settings file (Alembic = database "version control" for table changes).
#
# The database URL is NOT here. alembic/env.py reads it from app/config.py,
# so there is only one place to set it (DATABASE_URL in .env).
#
# Common commands (run in the project folder):
#   alembic upgrade head                            apply all migrations
#   alembic downgrade -1                            undo the last migration
#   alembic revision --autogenerate -m "message"    draft a new migration after you
#                                                   change app/models.py (always read it!)
#   alembic current                                 which migration is the database on?

[alembic]
# where the migration scripts live (%(here)s = folder of this file)
script_location = %(here)s/alembic

# put the project folder on Python's path, so env.py can do `from app import config`
# when you run the `alembic` command directly (from the project folder)
prepend_sys_path = .

# ---- logging (so you can see what Alembic is doing) ----
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
